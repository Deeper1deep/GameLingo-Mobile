name: Publish

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'إصدار العرض (مثال: 0.2.0)'
        required: true
        type: string
      changelog:
        description: 'سجل التغييرات بالعربي اللي هيظهر للمستخدمين'
        required: true
        type: string
      mandatoryUpdate:
        description: 'تحديث إجباري؟'
        required: false
        default: false
        type: boolean
      minimumSupportedVersionCode:
        description: 'أقل versionCode مدعوم (الأقدم منه يُجبَر على التحديث)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  EXPECTED_CERT_SHA256: '0e:1d:8a:cc:71:38:01:c1:41:39:af:7c:77:a1:ac:ad:de:d9:77:f6:d1:3a:c6:38:1d:11:2f:8a:23:84:66:7e'

jobs:
  publish:
    name: Build signed release and publish to GameLingo-Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate versionName input
        env:
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName must look like 1.2.3, got: $VERSION_NAME"
            exit 1
          fi

      - name: Restore Gradle wrapper jar and make gradlew executable
        run: |
          base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x ./gradlew

      - name: Bump version (versionCode +1, versionName from input)
        id: version
        env:
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          current_code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          new_code=$((current_code + 1))
          sed -i "s/versionCode = ${current_code}/versionCode = ${new_code}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          echo "code=${new_code}" >> "$GITHUB_OUTPUT"
          grep -n "versionCode\|versionName" app/build.gradle.kts

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/gamelingo-release.keystore
          chmod 600 keystore/gamelingo-release.keystore

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          GAMELINGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GAMELINGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS12: key password equals the store password. ANDROID_KEY_PASSWORD is
          # intentionally never referenced (obsolete secret left over from setup).
          GAMELINGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and pinned certificate
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner binary: $APKSIGNER"
          # Print the full verifier output: a silent assignment failure under
          # bash -e hid the real error in earlier runs.
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # build-tools <=36 prints "Signer #1 certificate ...", 37+ prints
          # "V2 Signer: certificate ..." - match the version-agnostic core.
          CERT=$(grep 'certificate SHA-256 digest' certs.txt | head -1)
          test -n "$CERT"
          echo "CERT=$CERT"
          # apksigner prints the digest without colons; EXPECTED_CERT_SHA256 keeps
          # the colonated pinned form, so compare both sides colon-stripped.
          echo "$CERT" | tr -d ':' | grep -qi "$(echo "$EXPECTED_CERT_SHA256" | tr -d ':')" || { echo 'Certificate mismatch: refusing to publish'; exit 1; }

      - name: Compute APK hash and size
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      # The signed APK is ~108 MB, over GitHub's 100 MB per-file push limit, so it
      # ships as a GitHub Release asset on GameLingo-Updates (assets allow 2 GB);
      # only the tiny latest.json is committed to the repo.
      - name: Create GitHub Release with the signed APK
        env:
          GH_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          VERSION_NAME: ${{ inputs.versionName }}
          CHANGELOG_TEXT: ${{ inputs.changelog }}
        run: |
          APK_NAME="gamelingo-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          gh release create "v${VERSION_NAME}" \
            --repo Deeper1deep/GameLingo-Updates \
            --title "GameLingo Mobile v${VERSION_NAME}" \
            --notes "$CHANGELOG_TEXT" \
            "$APK_NAME"

      - name: Clone GameLingo-Updates
        run: |
          git clone "https://x-access-token:${{ secrets.UPDATES_REPO_TOKEN }}@github.com/Deeper1deep/GameLingo-Updates.git" updates-repo

      - name: Publish latest.json
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          CHANGELOG_TEXT: ${{ inputs.changelog }}
          MANDATORY: ${{ inputs.mandatoryUpdate }}
          MIN_CODE: ${{ inputs.minimumSupportedVersionCode }}
          APK_SHA: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -e
          export APK_NAME="gamelingo-${VERSION_NAME}.apk"
          export RELEASE_DATE=$(date +%F)
          python3 - <<'PYJSON'
          import json, os
          data = {
              "schemaVersion": 1,
              "appId": "com.gamelingo.mobile",
              "latestVersion": os.environ["VERSION_NAME"],
              "latestVersionCode": int(os.environ["VERSION_CODE"]),
              "minimumSupportedVersionCode": int(os.environ["MIN_CODE"]),
              "releaseDate": os.environ["RELEASE_DATE"],
              "changelog": os.environ["CHANGELOG_TEXT"],
              "downloadUrl": "https://github.com/Deeper1deep/GameLingo-Updates/releases/download/v" + os.environ["VERSION_NAME"] + "/" + os.environ["APK_NAME"],
              "sha256": os.environ["APK_SHA"],
              "mandatoryUpdate": os.environ["MANDATORY"].lower() == "true",
              "fileSizeBytes": int(os.environ["APK_SIZE"]),
          }
          with open("updates-repo/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PYJSON

      - name: Commit and push latest.json to GameLingo-Updates
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          cd updates-repo
          git config user.name "gamelingo-publish[bot]"
          git config user.email "gamelingo-publish[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "release: v${VERSION_NAME} (versionCode ${VERSION_CODE})"
          git push origin main

      - name: Commit version bump to source repo
        env:
          VERSION_NAME: ${{ inputs.versionName }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          git config user.name "gamelingo-publish[bot]"
          git config user.email "gamelingo-publish[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "release: bump to v${VERSION_NAME} (versionCode ${VERSION_CODE})"
          git tag "v${VERSION_NAME}"
          git push origin main --tags

      - name: Wipe the keystore
        if: always()
        run: rm -rf keystore
