name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: "Upload the debug APK as an artifact (uses artifact storage quota)"
        type: boolean
        default: false

# The debug APK artifact is OFF by default. The account's Actions artifact
# storage quota is exhausted, so every run must opt out unless someone really
# needs the build output for debugging. Enable it manually from the Actions
# tab (workflow_dispatch -> upload_debug_apk=true); PR and push runs keep it
# off. Nothing else about the pipeline depends on the artifact, so this
# cannot hide a failure: compile, unit tests, lint and the unsigned-APK
# assembly still run and still fail the job when they break.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK (opt-in only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_debug_apk == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gamelingo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
