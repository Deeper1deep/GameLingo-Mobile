name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_debug_apk:
        description: "Upload the debug APK and test reports as artifacts (uses artifact storage quota)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The debug APK and test-report artifacts are OFF by default. The account's
# Actions artifact storage quota is exhausted, so every run must opt out
# unless someone really needs the build output for debugging. Enable it
# manually from the Actions tab (workflow_dispatch -> upload_debug_apk=true);
# PR and push runs keep it off. Nothing else about the pipeline depends on
# the artifacts, so this cannot hide a failure: the APK build, unit tests and
# lint still run and still fail the job when they break.
jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Gradle wrapper jar and make gradlew executable
        run: |
          base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload debug APK (opt-in only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_debug_apk == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gamelingo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports (opt-in only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_debug_apk == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: gamelingo-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
          if-no-files-found: ignore
